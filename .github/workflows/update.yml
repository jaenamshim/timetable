name: Update Schedule

on:
  # GitHub silently DROPS a large fraction of high-frequency cron fires
  # (observed: '*/30' actually landing every 45-55 min, and an 8-hour gap
  # during RAN1#126 on 2026-08-27). So we no longer rely on one fire per
  # rebuild: each fire runs a ~55-minute internal poll loop (see LOOP_*
  # below), which means even one surviving fire per hour keeps the page
  # within ~5 minutes of the FTP.
  schedule:
    - cron: '*/20 * * * *'

  # Manual trigger from the Actions tab. Also the endpoint to hit from an
  # external scheduler (e.g. a GCP Cloud Function) via the REST API:
  #   POST /repos/jaenamshim/timetable/actions/workflows/update.yml/dispatches
  #   {"ref":"main"}
  # An external trigger is the only fully reliable option — GitHub makes no
  # delivery guarantee for cron.
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: 'How long to keep polling in this run (minutes)'
        required: false
        default: '55'

  # Also rebuild when the template or build script changes
  push:
    branches: [main]
    paths:
      - 'template.html'
      - 'build.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

# Never run two builders at once, but never cancel one either: a cancelled
# run would abort its whole poll window.
concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Ceiling well above the loop window so a hung fetch can't burn hours.
    timeout-minutes: 75
    env:
      LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '55' }}
      LOOP_INTERVAL_SECONDS: '300'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and publish on a loop
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A push-triggered run only needs one pass: the point is to render
          # the new template/build.py immediately, not to poll.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            LOOP_MINUTES=0
          fi

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          pass=0

          while :; do
            pass=$((pass + 1))
            echo "::group::Pass ${pass} ($(date -u '+%H:%M:%S UTC'))"

            # A single failed pass (FTP hiccup, portal timeout) must not kill
            # the loop — the next pass 5 minutes later usually succeeds.
            if python build.py; then
              git add index.html
              if git diff --staged --quiet; then
                echo "No changes."
              else
                git commit -m "Auto-update schedule [skip ci]"
                # Another run (or a manual upload) may have pushed since we
                # checked out; rebase onto it rather than failing.
                for attempt in 1 2 3; do
                  git pull --rebase --autostash origin main && git push && break
                  echo "Push attempt ${attempt} failed; retrying."
                  sleep 5
                done
              fi
            else
              echo "Build failed on pass ${pass}; will retry."
            fi
            echo "::endgroup::"

            now=$(date +%s)
            # Stop if the next pass wouldn't finish inside the window.
            if [ $(( now + LOOP_INTERVAL_SECONDS )) -gt "${deadline}" ]; then
              echo "Poll window complete after ${pass} pass(es)."
              break
            fi
            sleep "${LOOP_INTERVAL_SECONDS}"
          done
