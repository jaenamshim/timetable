<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f6f5f1" />
<title>RAN1 Meeting Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #2a2a2a;
    --muted: #777775;
    --line: #e6e5df;
    --line-strong: #cdccc6;
    --now: #c54545;

    /* Category colors. The strong variant is for chips, NOW accent, and
       session left-border. The bg/fg variants are used INSIDE session blocks
       (pastel background + dark text) for much better readability on phone
       screens and in bright sunlight than white-text-on-color. */
    --cat-6GR:    #2d7569;
    --cat-AI78:   #a14770;
    --cat-MAINT:  #b06525;
    --cat-R20:    #3d6299;
    --cat-6GR-bg:   #d8ebe6;
    --cat-AI78-bg:  #f0dde6;
    --cat-MAINT-bg: #f0dfc8;
    --cat-R20-bg:   #d8e1f0;
    --cat-6GR-fg:   #154037;
    --cat-AI78-fg:  #5c2440;
    --cat-MAINT-fg: #5c3210;
    --cat-R20-fg:   #1d3358;

    /* 16px per 10-min = 1.6px/min: a full 08:30-19:30 day fits one screen
       (~1,050px + header), same density as karlla1220's 3GPPSchedule. */
    --row-h: 16px;
    --label-w: 56px;

    --dim-opacity: 0.18;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 16px 24px 8px;
    background: var(--surface);
  }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .meta {
    font-size: 11px; color: var(--muted); margin-bottom: 10px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .meta a { color: inherit; }
  .meta .sep { margin: 0 6px; opacity: 0.6; }
  /* Source docx links get their own line, exempt from the mobile meta
     clamp: the tail of the filename (title + version, e.g. "...sessions
     _v07_1.docx") is what tells you whether the chair posted a new rev, so
     names are shown in full and simply wrap — never ellipsized. */
  .sources {
    font-size: 10px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 4px;
    line-height: 1.7;
  }
  .sources a {
    color: inherit;
    text-decoration-color: var(--line-strong);
    text-underline-offset: 2px;
  }
  .sources a:active, .sources a:hover { color: var(--ink); }
  .sources .src-sep { margin: 0 6px; opacity: 0.5; }
  .clock {
    display: inline-block;
    background: #f0eee8;
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 500;
    color: var(--ink);
  }

  .controls {
    display: flex; flex-direction: column; gap: 8px;
    /* Sticky bar: day tabs + filters stay reachable while scrolled into the
       grid — the single most frequent interaction on a phone. Its measured
       height is published as --controls-h (see JS) so the sticky room
       headers stack right below it. */
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--surface);
    padding: 8px 24px 10px;
    border-bottom: 1px solid var(--line);
  }
  .controls-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .day-tabs { display: flex; flex-wrap: wrap; gap: 4px; }

  /* touch-action:manipulation kills the 300ms double-tap-zoom delay on
     buttons; the tap-highlight flash looks broken on the dense grid. */
  .chip, .session, .panel-toggle {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .chip.day {
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: var(--bg);
  }
  .chip.day[data-on="true"] {
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }

  /* Spanning sessions sit in their own grid cell that overlaps multiple
     room-cols. Pointer-events:none lets clicks on EMPTY parts pass through
     to the room-col underneath (e.g. hour-lines); the .session itself
     re-enables pointer-events so it remains clickable. */
  .span-cell {
    position: relative;
    pointer-events: none;
    z-index: 1;
  }
  .span-cell .session {
    pointer-events: auto;
  }

  /* Session-detail modal: opens on cell click. */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .modal-backdrop.shown { opacity: 1; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    padding: 18px 20px 20px;
    max-width: 460px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 10px;
  }
  .modal-cat {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    border-left: 3px solid;
  }
  .modal-cat[data-cat="6GR"]   { background: var(--cat-6GR-bg);   color: var(--cat-6GR-fg);   border-left-color: var(--cat-6GR); }
  .modal-cat[data-cat="AI78"]  { background: var(--cat-AI78-bg);  color: var(--cat-AI78-fg);  border-left-color: var(--cat-AI78); }
  .modal-cat[data-cat="MAINT"] { background: var(--cat-MAINT-bg); color: var(--cat-MAINT-fg); border-left-color: var(--cat-MAINT); }
  .modal-cat[data-cat="R20"]   { background: var(--cat-R20-bg);   color: var(--cat-R20-fg);   border-left-color: var(--cat-R20); }
  .modal-close {
    background: transparent; border: none;
    font-size: 24px; line-height: 1;
    cursor: pointer; padding: 2px 6px;
    color: var(--muted);
  }
  .modal-close:hover { color: var(--ink); }
  .modal-title {
    font-size: 16px; font-weight: 600;
    margin: 4px 0 14px; word-break: break-word;
  }
  .modal-rows { display: grid; grid-template-columns: 80px 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
  .modal-rows dt { color: var(--muted); font-weight: 500; }
  .modal-rows dd { margin: 0; word-break: break-word; }
  .chip {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
    user-select: none;
  }
  .chip.cat[data-on="true"] { color: white; border-color: transparent; }
  .chip.cat[data-cat="6GR"][data-on="true"]   { background: var(--cat-6GR); }
  .chip.cat[data-cat="AI78"][data-on="true"]  { background: var(--cat-AI78); }
  .chip.cat[data-cat="MAINT"][data-on="true"] { background: var(--cat-MAINT); }
  .chip.cat[data-cat="R20"][data-on="true"]   { background: var(--cat-R20); }
  .chip.cat[data-on="false"] { opacity: 0.5; }

  .chip.day[data-on="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip.now { background: var(--now); color: white; border-color: var(--now); }
  .chip.now:hover { filter: brightness(1.08); }
  .chip.now[disabled] { background: var(--line-strong); border-color: var(--line-strong); color: var(--muted); cursor: not-allowed; }

  .divider { width: 1px; height: 18px; background: var(--line-strong); margin: 0 4px; }

  main { padding: 16px 24px 80px; }

  .info-banner {
    background: #f0eee8;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .info-banner b { color: var(--ink); }

  /* NOTE: no overflow:hidden here. An overflow:hidden ancestor makes
     position:sticky resolve against THIS (never-scrolling) box instead of
     the viewport, which pushed the sticky room headers down INTO the grid
     by ~var(--controls-h). Corner rounding is done on .day-title instead. */
  .day-section { margin-bottom: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .day-title {
    border-radius: 5px 5px 0 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: #faf9f4;
  }
  .day-title .date { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .day-title .today-badge {
    display: inline-block;
    background: var(--now);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 8px;
    letter-spacing: 0.06em;
    vertical-align: middle;
  }

  /* No horizontal scroll container anywhere: columns compress to fit
     (minmax(0,1fr)). This removes the iOS "maybe-horizontal gesture" bug
     class entirely — with no h-scrollable ancestor, position:sticky on the
     header row works against the page scroll on BOTH desktop and mobile. */
  .room-head, .time-head {
    position: sticky;
    top: var(--controls-h, 0px); /* sit just below the sticky controls bar */
    z-index: 30;
  }
  /* The leftmost time axis is pinned: sticky-left keeps it on screen in any
     horizontally-scrolling context (a no-op when everything already fits),
     with an opaque background so content slides UNDER it, not through it. */
  .time-col {
    position: sticky;
    left: 0;
    z-index: 20;
    background: var(--surface);
  }
  .time-head {
    left: 0;
    z-index: 35; /* above both room heads and the time column */
  }
  .grid {
    display: grid;
    grid-template-columns: var(--label-w) repeat(var(--n-rooms), minmax(0, 1fr));
    position: relative;
    min-width: 100%;
  }
  .room-head {
    padding: 8px 6px;
    font-size: 11px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
    background: #faf9f4;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .time-head { border-bottom: 1px solid var(--line); background: #faf9f4; }

  .time-col, .room-col { position: relative; }
  .time-col { border-right: 1px solid var(--line); }
  .time-label {
    position: absolute;
    right: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    transform: translateY(-50%);
  }
  .room-col { border-left: 1px solid var(--line); position: relative; }

  .hour-line {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px dashed var(--line);
    pointer-events: none;
  }
  .hour-line.solid { border-top-style: solid; }

  .break-block {
    position: absolute;
    left: 0; right: 0;
    background: repeating-linear-gradient(45deg, #f6f5f1, #f6f5f1 4px, #ecebe2 4px, #ecebe2 8px);
    color: var(--muted);
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }

  .session {
    position: absolute;
    left: 2px; right: 2px;
    padding: 2px 5px;
    border-radius: 3px;
    font-size: 11px;
    line-height: 1.25;
    overflow: hidden;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.05s;
    border-left: 3px solid;
  }
  /* Graduated degradation for short slots (RAN1 schedules are full of
     20-30 min fragments). Mirrors karlla's short-session/tiny-session:
     <35 min: drop the AI line, single-line ellipsized title.
     <25 min: additionally drop the time line; title only. */
  .session.short { padding: 1px 4px; }
  .session.short .s-ai { display: none; }
  .session.short .s-title {
    font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session.short .s-meta { font-size: 9px; }
  .session.tiny .s-meta { display: none; }
  .session.tiny .s-title { font-size: 9px; }
  @media (hover: hover) {
    .session:hover { transform: translateX(1px); filter: brightness(0.97); }
  }
  .session[data-cat="6GR"]   { background: var(--cat-6GR-bg);   color: var(--cat-6GR-fg);   border-left-color: var(--cat-6GR); }
  .session[data-cat="AI78"]  { background: var(--cat-AI78-bg);  color: var(--cat-AI78-fg);  border-left-color: var(--cat-AI78); }
  .session[data-cat="MAINT"] { background: var(--cat-MAINT-bg); color: var(--cat-MAINT-fg); border-left-color: var(--cat-MAINT); }
  .session[data-cat="R20"]   { background: var(--cat-R20-bg);   color: var(--cat-R20-fg);   border-left-color: var(--cat-R20); }
  .session.dim { opacity: var(--dim-opacity); }
  .session .s-title { font-weight: 600; }
  .session .s-meta  { font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.75; }
  .session .s-ai    { margin-top: 2px; font-size: 10px; opacity: 0.85; }

  .now-line {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px solid var(--now);
    z-index: 10;
    pointer-events: none;
  }
  .now-line::before {
    content: "";
    position: absolute;
    left: -5px; top: -5px;
    width: 8px; height: 8px;
    background: var(--now);
    border-radius: 50%;
  }
  .now-line .now-label {
    position: absolute;
    right: 4px; top: -16px;
    background: var(--now);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 2px;
  }
  /* Zero-height strip across the room columns at the current time; carries
     the NOW label, which JS slides to the visible edge. */
  .now-overlay {
    position: relative;
    height: 0;
    align-self: start;
    z-index: 31;
    pointer-events: none;
  }
  .now-overlay .now-label {
    position: absolute;
    top: -17px;
    left: 0;
    background: var(--now);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    padding: 1px 5px;
    border-radius: 2px;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  .panel-toggle {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 60;
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .panel {
    position: fixed;
    right: -340px;
    top: 0; bottom: 0;
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--line);
    transition: right 0.25s;
    padding: 20px;
    overflow-y: auto;
    z-index: 70;
  }
  .panel.open { right: 0; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }
  .panel .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .panel button.close { background: none; border: none; cursor: pointer; font-size: 18px; }
  .panel .group { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .panel label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; cursor: pointer; }
  .panel input[type="checkbox"] { accent-color: var(--ink); }

  .panel .btn-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .panel .btn-row .chip { flex: 1; text-align: center; }

  .opacity-control { margin: 10px 0 6px; }
  .opacity-control label { display: block; padding: 0 0 4px; font-size: 11px; color: var(--muted); }
  .opacity-control input[type="range"] { width: 100%; accent-color: var(--ink); }
  .opacity-control .val { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink); }

  footer { text-align: center; padding: 16px; color: var(--muted); font-size: 11px; line-height: 1.6; }
  footer a { color: inherit; }

  /* Mobile: ALL rooms fit the viewport — no horizontal scrolling at all.
     At ~390px that's ~66px per room column; block text is heavily truncated
     but the grid's job on a phone is the conflict overview — tap a block for
     the full detail modal. Killing the h-scroll container also removes the
     whole iOS pan-x gesture problem class and lets sticky headers work. */
  @media (max-width: 768px) {
    :root {
      --row-h: 14px;
      --label-w: 38px;
    }
    header { padding: 10px 12px 8px; }
    h1 { font-size: 17px; }
    .meta {
      font-size: 10px;
      /* Sources list can run 3+ lines on a phone; clamp to 2. */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .controls { padding: 6px 12px 8px; }
    main { padding: 8px 8px 72px; }
    .room-head {
      font-size: 8px;
      padding: 4px 2px;
      /* Two-line wrap beats a 3-char ellipsis for names like
         "0.6/0.7 Madrid/Lisbon". */
      white-space: normal;
      line-height: 1.15;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .time-label { font-size: 8px; right: 3px; }
    .session { font-size: 9px; padding: 1px 3px; border-left-width: 2px; }
    .session .s-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session .s-meta { font-size: 8px; }
    .session .s-ai { font-size: 8px; margin-top: 1px; }
    .session.short .s-title, .session.tiny .s-title { font-size: 8px; }
    .session.short .s-meta { display: none; }
    .chip { padding: 4px 9px; font-size: 11px; }
    .panel { width: min(300px, 86vw); }
    /* Detail modal as a bottom sheet — thumb-friendly. */
    .modal-backdrop { align-items: flex-end; padding: 0; }
    .modal {
      max-width: none;
      border-radius: 14px 14px 0 0;
      border-left: none; border-right: none; border-bottom: none;
      max-height: 75vh;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
    .panel-toggle { bottom: calc(14px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<header>
  <h1 id="title">Loading...</h1>
  <div class="meta" id="meta">Loading...</div>
  <div class="sources" id="sources"></div>
</header>

<div class="controls" id="controls">
  <div class="controls-row">
    <button class="chip cat" data-cat="6GR"   data-on="true">6GR</button>
    <button class="chip cat" data-cat="AI78"  data-on="true">AI 7/8</button>
    <button class="chip cat" data-cat="MAINT" data-on="true">Maintenance</button>
    <button class="chip cat" data-cat="R20"   data-on="true">R20</button>
    <span class="divider"></span>
    <button class="chip now" id="now-btn">NOW</button>
  </div>
  <div class="day-tabs">
    <button class="chip day" data-day="Mon" data-on="true">Mon</button>
    <button class="chip day" data-day="Tue" data-on="true">Tue</button>
    <button class="chip day" data-day="Wed" data-on="true">Wed</button>
    <button class="chip day" data-day="Thu" data-on="true">Thu</button>
    <button class="chip day" data-day="Fri" data-on="true">Fri</button>
  </div>
</div>

<main id="main"></main>

<button class="panel-toggle" id="panel-toggle">◀ Filter</button>
<aside class="panel" id="panel">
  <div class="row">
    <h2>Session Filter</h2>
    <button class="close" id="panel-close">×</button>
  </div>
  <div class="btn-row">
    <button class="chip" id="select-all">Select all</button>
    <button class="chip" id="deselect-all">Deselect all</button>
  </div>
  <div class="opacity-control">
    <label>Unchecked opacity: <span class="val" id="opacity-val">18%</span></label>
    <input type="range" id="opacity-slider" min="0" max="100" step="1" value="18" />
  </div>
  <div class="group" id="ai-filter-group"></div>
</aside>

<footer id="footer">
  Auto-generated from 3GPP FTP. For feedback or bug reports:
  <a href="mailto:jshim@ofinno.com">Jae-Nam Shim &lt;jshim@ofinno.com&gt;</a>
</footer>

<script>
/* ============================================================
   1. DATA — injected at build time by build.py
   ============================================================ */
const scheduleData = /*INJECT:SCHEDULE_DATA*/ {
  "meeting": "RAN1#126",
  "meetingInfo": {
    "meetingNumber": "126",
    "title": "3GPPRAN1#126",
    "city": "Maastricht",
    "startDate": "2026-08-24",
    "endDate": "2026-08-28",
    "timezone": "Europe/Amsterdam"
  },
  "aiTitles": {
    "1": "Opening of the meeting",
    "2": "Approval of Agenda",
    "3": "Highlights from RAN plenary",
    "4": "Approval of Minutes from previous meetings",
    "5": "Incoming Liaison Statements",
    "6": "Pre-Rel-19 E-UTRA Maintenance",
    "7": "Pre-Rel-19 NR Maintenance",
    "8": "Maintenance on Rel-19 NR and E-UTRA",
    "8.1": "Maintenance on AI/ML for NR Air interface, NR MIMO Phase 5,  NES and NTN for NR and IoT",
    "8.2": "Maintenance on others",
    "8.3": "Maintenance on UE features",
    "9": "Release 20 NR",

/* ============================================================
   2. Constants & time helpers
   ============================================================ */
/* PX_PER_MIN is derived from the CSS variable --row-h so that the mobile
   media query (which reduces --row-h to 22px) takes effect without needing
   to ship a separate JS constant. */
const getPxPerMin = () => parseFloat(
  getComputedStyle(document.documentElement).getPropertyValue('--row-h')
) / 10;
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
const MEETING_TZ = (scheduleData.meetingInfo && scheduleData.meetingInfo.timezone) || 'UTC';

const toMin = (hhmm) => {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
};
const pad2 = (n) => String(n).padStart(2, "0");
const dayStart = toMin(scheduleData.dayRange.start);
const dayEnd   = toMin(scheduleData.dayRange.end);

/* Get current date/time as it would be in the meeting city. */
function meetingNow() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: MEETING_TZ,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    weekday: 'short', hour12: false,
  }).formatToParts(now);
  const lookup = {};
  parts.forEach(p => { lookup[p.type] = p.value; });
  const ymd = lookup.year + '-' + lookup.month + '-' + lookup.day;
  const hour = parseInt(lookup.hour, 10);
  const minute = parseInt(lookup.minute, 10);
  const wk = (lookup.weekday || '').replace('.', '').slice(0, 3);
  return { ymd, dayName: wk, minutes: hour * 60 + minute, hour, minute };
}

function isWithinMeeting() {
  const mi = scheduleData.meetingInfo || {};
  if (!mi.startDate || !mi.endDate) return false;
  const today = meetingNow().ymd;
  return today >= mi.startDate && today <= mi.endDate;
}

/* ============================================================
   3. State
   ============================================================ */
const state = {
  cats:  { "6GR": true, "AI78": true, "MAINT": true, "R20": true },
  // Days behave like tabs: exactly one day is shown at a time.
  days:  Object.fromEntries(DAYS.map(d => [d, false])),
  aiFilter: {},
};

const WITHIN_MEETING = isWithinMeeting();
const MEETING_DAY = (() => {
  if (!WITHIN_MEETING) return null;
  const d = meetingNow().dayName;
  return DAYS.includes(d) ? d : null;
})();

/* Persist active day + scroll position across page reloads (e.g. the 30-min
   auto-refresh). sessionStorage scope = this tab only. */
/* Persist FILTER state (category chips, AI checkboxes, dim opacity) in two
   layers, following karlla1220's model:
   - localStorage: per-browser, survives closing the tab. "My filters are
     just how I left them on this phone/laptop."
   - URL hash (#f=...): shareable/bookmarkable. Encodes only OFF items so
     the default state keeps a clean URL. Hash wins over localStorage when
     present, so a shared link always shows what the sender saw. */
const FILTER_KEY = 'ran1_filters';
const DIM_DEFAULT = 18; // percent, must match the slider's initial value

function currentDimPct() {
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dim-opacity'));
  return isNaN(v) ? DIM_DEFAULT : Math.round(v * 100);
}

function collectFilterState() {
  return {
    catsOff: Object.keys(state.cats).filter(c => !state.cats[c]),
    aisOff:  Object.keys(state.aiFilter).filter(a => state.aiFilter[a] === false),
    dim:     currentDimPct(),
  };
}

// encodeURIComponent leaves ',' unescaped, but ',' is our token separator
// and AI names contain literal commas ("AI 10.5.4.1, 10.5.4.3").
const encTok = (s) => encodeURIComponent(s).replace(/,/g, '%2C');

function saveFilters() {
  const f = collectFilterState();
  try { localStorage.setItem(FILTER_KEY, JSON.stringify(f)); } catch (e) {}
  // Mirror to URL hash
  const parts = [];
  f.catsOff.forEach(c => parts.push('c:' + encTok(c)));
  f.aisOff.forEach(a => parts.push('a:' + encTok(a)));
  if (f.dim !== DIM_DEFAULT) parts.push('o:' + f.dim);
  try {
    history.replaceState(null, '',
      parts.length ? '#f=' + parts.join(',') : location.pathname + location.search);
  } catch (e) {}
}

function loadFiltersFromHash() {
  const h = location.hash;
  if (!h || !h.startsWith('#f=')) return null;
  const f = { catsOff: [], aisOff: [], dim: DIM_DEFAULT };
  h.slice(3).split(',').forEach(tok => {
    const i = tok.indexOf(':');
    if (i < 0) return;
    const type = tok.slice(0, i), val = decodeURIComponent(tok.slice(i + 1));
    if (type === 'c') f.catsOff.push(val);
    else if (type === 'a') f.aisOff.push(val);
    else if (type === 'o') { const n = parseInt(val, 10); if (!isNaN(n)) f.dim = Math.min(100, Math.max(0, n)); }
  });
  return f;
}

function loadFiltersFromStorage() {
  try {
    const raw = localStorage.getItem(FILTER_KEY);
    if (!raw) return null;
    const f = JSON.parse(raw);
    return {
      catsOff: Array.isArray(f.catsOff) ? f.catsOff : [],
      aisOff:  Array.isArray(f.aisOff)  ? f.aisOff  : [],
      dim:     typeof f.dim === 'number' ? f.dim : DIM_DEFAULT,
    };
  } catch (e) { return null; }
}

// AI names aren't known until buildAIFilter() runs (they come from the
// injected data), so stash the restored OFF-list for it to apply.
let RESTORED_AI_OFF = [];
function applyDimPct(pct) {
  document.documentElement.style.setProperty('--dim-opacity', (pct / 100).toFixed(2));
  const slider = document.getElementById('opacity-slider');
  const label  = document.getElementById('opacity-val');
  if (slider) slider.value = pct;
  if (label)  label.textContent = pct + '%';
}
(function restoreFilters() {
  const f = loadFiltersFromHash() || loadFiltersFromStorage();
  if (!f) return;
  f.catsOff.forEach(c => { if (c in state.cats) state.cats[c] = false; });
  RESTORED_AI_OFF = f.aisOff;
  if (f.dim !== DIM_DEFAULT) applyDimPct(f.dim);
})();

const VIEW_STATE_KEY = 'ran1_view_state';
function saveViewState() {
  const activeDay = DAYS.find(d => state.days[d]) || null;
  try {
    sessionStorage.setItem(VIEW_STATE_KEY, JSON.stringify({
      activeDay,
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    }));
  } catch (e) { /* private mode etc. */ }
}
function loadViewState() {
  try {
    const raw = sessionStorage.getItem(VIEW_STATE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

const savedView = loadViewState();
// Default selected day: previously viewed day → today (if within meeting) → Monday.
let DEFAULT_DAY;
if (savedView && savedView.activeDay && DAYS.includes(savedView.activeDay)) {
  DEFAULT_DAY = savedView.activeDay;
} else if (MEETING_DAY) {
  DEFAULT_DAY = MEETING_DAY;
} else {
  DEFAULT_DAY = 'Mon';
}
state.days[DEFAULT_DAY] = true;

let lastUserScroll = 0;
window.addEventListener("wheel",     () => { lastUserScroll = Date.now(); }, { passive: true });
window.addEventListener("touchmove", () => { lastUserScroll = Date.now(); }, { passive: true });

/* ============================================================
   4. Rendering
   ============================================================ */
function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  // Recompute per render — values come from CSS so mobile media query takes effect.
  const PX_PER_MIN = getPxPerMin();
  const totalH = (dayEnd - dayStart) * PX_PER_MIN;

  // Out-of-meeting banner
  if (!WITHIN_MEETING && scheduleData.meetingInfo && scheduleData.meetingInfo.startDate) {
    const mi = scheduleData.meetingInfo;
    const banner = document.createElement("div");
    banner.className = "info-banner";
    const today = meetingNow().ymd;
    let msg;
    if (today < mi.startDate) {
      msg = '<b>' + (mi.title || scheduleData.meeting) + '</b> hasn\u2019t started yet \u2014 ' +
            'runs ' + mi.startDate + ' to ' + mi.endDate + ' in ' + (mi.city || '?') +
            '. The schedule below is a preview; the "NOW" indicator is hidden until the meeting begins.';
    } else {
      msg = '<b>' + (mi.title || scheduleData.meeting) + '</b> has ended (' +
            mi.startDate + ' \u2013 ' + mi.endDate + ', ' + (mi.city || '?') +
            '). Shown for reference; the "NOW" indicator is hidden.';
    }
    banner.innerHTML = msg;
    main.appendChild(banner);
  }

  DAYS.forEach(day => {
    if (!state.days[day]) return;
    const daySessions = scheduleData.sessions.filter(s => s.day === day);
    const section = document.createElement("section");
    section.className = "day-section";
    section.dataset.day = day;
    section.innerHTML =
      '<div class="day-title">' + day +
      (day === MEETING_DAY ? ' <span class="today-badge">TODAY</span>' : '') +
      '<span class="date"></span></div>' +
      '<div class="grid-wrap"><div class="grid" style="--n-rooms:' + scheduleData.rooms.length + '"></div></div>';
    const grid = section.querySelector(".grid");

    const empty = document.createElement("div"); empty.className = "time-head"; grid.appendChild(empty);
    scheduleData.rooms.forEach(r => {
      const h = document.createElement("div"); h.className = "room-head"; h.textContent = r; grid.appendChild(h);
    });

    const timeCol = document.createElement("div");
    timeCol.className = "time-col";
    timeCol.style.height = totalH + "px";
    timeCol.style.gridColumn = "1";
    timeCol.style.gridRow = "2";
    grid.appendChild(timeCol);

    for (let m = dayStart; m <= dayEnd; m += 30) {
      const top = (m - dayStart) * PX_PER_MIN;
      const label = document.createElement("div");
      label.className = "time-label";
      label.textContent = pad2(Math.floor(m / 60)) + ":" + pad2(m % 60);
      label.style.top = top + "px";
      timeCol.appendChild(label);
    }

    const roomCols = scheduleData.rooms.map((_, idx) => {
      const c = document.createElement("div");
      c.className = "room-col";
      c.style.height = totalH + "px";
      c.style.gridColumn = (idx + 2).toString();
      c.style.gridRow = "2";
      grid.appendChild(c);
      for (let m = dayStart; m <= dayEnd; m += 30) {
        const top = (m - dayStart) * PX_PER_MIN;
        const ln = document.createElement("div");
        ln.className = "hour-line" + (m % 60 === 0 ? " solid" : "");
        ln.style.top = top + "px";
        c.appendChild(ln);
      }
      scheduleData.breaks.forEach(br => {
        const top = (toMin(br.start) - dayStart) * PX_PER_MIN;
        const h = (toMin(br.end) - toMin(br.start)) * PX_PER_MIN;
        const block = document.createElement("div");
        block.className = "break-block";
        block.style.top = top + "px";
        block.style.height = h + "px";
        block.textContent = idx === 0 ? br.label : "";
        c.appendChild(block);
      });
      return c;
    });

    // --- Determine which session block goes where (regular cell vs span) ---
    // A session can have span > 1 from the docx (gridSpan). When spanning,
    // we render it as a single grid cell that visually covers multiple
    // room columns. If duplicates exist in adjacent rooms (e.g. the offline
    // Mon-AM plenary that lists itself in BOTH Dalian and Shanghai cells),
    // suppress the redundant ones.
    const sameSig = (a, b) =>
      a.start === b.start && a.end === b.end && a.title === b.title &&
      (a.host || '') === (b.host || '') && a.category === b.category;
    const N_ROOMS = scheduleData.rooms.length;
    const renderable = daySessions.filter(s => {
      // Drop if our immediate left neighbor has the same signature, since
      // it'll auto-expand to cover us. Online (rooms 0-2) and offline (3+)
      // are separate groups — rooms 0 and 3 are group-leftmosts and never
      // dropped against the room on their left.
      if (s.room === 0 || s.room === 3) return true;
      return !daySessions.some(o =>
        o !== s && o.room === s.room - 1 && sameSig(o, s));
    });

    renderable.forEach(s => {
      const top = (toMin(s.start) - dayStart) * PX_PER_MIN;
      const h   = (toMin(s.end) - toMin(s.start)) * PX_PER_MIN;
      // Effective span = declared span, clamped to online/offline boundary
      // (online rooms = indices 0..2, offline = 3..N) and broken if any
      // session at a covered higher-index room overlaps in time.
      const declared = s.span || 1;
      const isOnline = s.room < 3;
      const boundary = isOnline ? 3 : N_ROOMS;
      let effSpan = Math.min(declared, boundary - s.room);
      // Also expand effSpan to cover identical sessions at adjacent rooms
      // (handles the "same plenary listed in Dalian AND Shanghai" case).
      for (let r = s.room + 1; r < boundary; r++) {
        const has = daySessions.some(o => o.room === r && sameSig(o, s));
        if (has) effSpan = Math.max(effSpan, r - s.room + 1);
        else break;
      }
      // Break the span if any DIFFERENT session in a covered higher-room
      // overlaps this time window — that room "wins" its own column.
      for (let off = 1; off < effSpan; off++) {
        const r = s.room + off;
        const conflict = daySessions.some(o =>
          o.room === r && !sameSig(o, s) &&
          !(toMin(o.end) <= toMin(s.start) || toMin(o.start) >= toMin(s.end)));
        if (conflict) { effSpan = off; break; }
      }

      const div = document.createElement("div");
      div.className = "session";
      div.dataset.cat = s.category;
      div.dataset.ai = s.ai;
      div.style.top = top + "px";
      div.style.height = (h - 2) + "px";
      const dur = toMin(s.end) - toMin(s.start);
      if (dur < 25) div.classList.add("tiny", "short");
      else if (dur < 35) div.classList.add("short");
      div.innerHTML =
        '<div class="s-title">' + s.title +
        (s.host ? ' <span style="opacity:.8;font-weight:400">\u00b7 ' + s.host + '</span>' : '') +
        '</div>' +
        '<div class="s-meta">' + s.start + '\u2013' + s.end + ' (' + dur + 'm)</div>' +
        (s.ai && s.ai !== s.title ? '<div class="s-ai">' + s.ai + '</div>' : '');
      const catOn = state.cats[s.category];
      const aiOn = state.aiFilter[s.ai] !== false;
      if (!catOn || !aiOn) div.classList.add("dim");

      const coveredRooms = [];
      for (let i = 0; i < effSpan; i++) coveredRooms.push(scheduleData.rooms[s.room + i]);
      div.addEventListener('click', () => openSessionModal(s, coveredRooms));

      if (effSpan > 1) {
        // Render in a span-cell that visually covers `effSpan` columns.
        const cell = document.createElement("div");
        cell.className = "span-cell";
        cell.style.gridColumn = (s.room + 2) + ' / span ' + effSpan;
        cell.style.gridRow = '2';
        cell.style.height = totalH + 'px';
        cell.appendChild(div);
        grid.appendChild(cell);
      } else {
        roomCols[s.room].appendChild(div);
      }
    });

    if (WITHIN_MEETING) drawNowLine(roomCols, day, PX_PER_MIN);

    main.appendChild(section);
  });

  updateHeaderClock();
  requestAnimationFrame(positionNowLabels);
}

function drawNowLine(roomCols, day, PX_PER_MIN) {
  const mn = meetingNow();
  if (mn.dayName !== day) return;
  const mins = mn.minutes;
  if (mins < dayStart || mins > dayEnd) return;
  const top = (mins - dayStart) * PX_PER_MIN;
  roomCols.forEach((c, i) => {
    const line = document.createElement("div");
    line.className = "now-line";
    line.style.top = top + "px";
    c.appendChild(line);
  });
  // The time label rides in a single overlay spanning all room columns, and
  // gets repositioned to whatever part of the grid is currently on screen
  // (see positionNowLabels) so "NOW 19:05" stays visible on a phone instead
  // of sitting off-screen past the last column.
  const grid = roomCols[0] && roomCols[0].parentElement;
  if (!grid) return;
  const overlay = document.createElement("div");
  overlay.className = "now-overlay";
  overlay.style.gridColumn = '2 / -1';
  overlay.style.gridRow = '2';
  overlay.style.top = top + "px";
  const lbl = document.createElement("div");
  lbl.className = "now-label";
  lbl.textContent = "NOW " + pad2(mn.hour) + ":" + pad2(mn.minute);
  overlay.appendChild(lbl);
  grid.appendChild(overlay);
}

/* Slide each day's NOW label to the right edge of the grid area that is
   actually visible in the viewport, clamped to the grid's own bounds. With
   no horizontal scrolling this is a no-op (the label sits at the far right);
   when the page IS panned horizontally it tracks the view. */
function positionNowLabels() {
  document.querySelectorAll('.now-overlay').forEach(ov => {
    const lbl = ov.querySelector('.now-label');
    if (!lbl) return;
    const r = ov.getBoundingClientRect();
    if (!r.width) return;
    const visibleRight = Math.min(r.right, window.innerWidth);
    const visibleLeft  = Math.max(r.left, 0);
    const w = lbl.offsetWidth || 64;
    // Offset within the overlay, kept inside both the overlay and the view.
    let x = visibleRight - r.left - w - 6;
    x = Math.min(x, r.width - w);
    x = Math.max(x, visibleLeft - r.left + 2);
    lbl.style.left = Math.max(0, x) + 'px';
  });
}
window.addEventListener('scroll', positionNowLabels, { passive: true });
window.addEventListener('resize', positionNowLabels);

function updateHeaderClock() {
  const el = document.getElementById("clock-text");
  if (!el) return;
  const mn = meetingNow();
  const tzLabel = MEETING_TZ.replace(/^.*\//, '').replace(/_/g, ' ');
  el.textContent = pad2(mn.hour) + ":" + pad2(mn.minute) + " " + tzLabel;
}

const CAT_DISPLAY = {
  '6GR':   '6G Research',
  'AI78':  'AI 7/8',
  'MAINT': 'Maintenance',
  'R20':   'R20',
};
function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function openSessionModal(s, coveredRooms) {
  // Remove any existing modal first.
  document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());

  const dur = toMin(s.end) - toMin(s.start);
  const roomList = (coveredRooms && coveredRooms.length ? coveredRooms : [scheduleData.rooms[s.room]])
    .map(escapeHtml).join('<br>');
  const catLabel = escapeHtml(CAT_DISPLAY[s.category] || s.category);

  // Resolve official agenda item titles (from the meeting's agenda.csv,
  // injected as scheduleData.aiTitles) for every AI number found in the
  // session's ai/title strings: "AI 6/8.1" -> 6, 8.1; "AI 1, 2, 3" -> 1,2,3.
  let agendaRows = '';
  const aiTitles = scheduleData.aiTitles || {};
  const nums = [...new Set(((s.ai || '') + ' ' + (s.title || ''))
    .split(/[^0-9.]+/).filter(Boolean)
    .map(n => n.replace(/\.$/, ''))
    .filter(n => aiTitles[n]))];
  if (nums.length) {
    agendaRows = '<dt>Agenda</dt><dd>' + nums.map(n =>
      '<b style="font-weight:600">' + escapeHtml(n) + '</b> ' +
      escapeHtml(aiTitles[n])).join('<br>') + '</dd>';
  }

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-header">' +
        '<span class="modal-cat" data-cat="' + escapeHtml(s.category) + '">' + catLabel + '</span>' +
        '<button class="modal-close" aria-label="Close">\u00d7</button>' +
      '</div>' +
      '<div class="modal-title">' + escapeHtml(s.title) + '</div>' +
      '<dl class="modal-rows">' +
        '<dt>Day</dt><dd>' + escapeHtml(s.day) + '</dd>' +
        '<dt>Time</dt><dd>' + escapeHtml(s.start) + '\u2013' + escapeHtml(s.end) + ' (' + dur + ' min)</dd>' +
        '<dt>Room</dt><dd>' + roomList + '</dd>' +
        (s.host ? ('<dt>Host</dt><dd>' + escapeHtml(s.host) + '</dd>') : '') +
        (s.ai   ? ('<dt>AI Item</dt><dd>' + escapeHtml(s.ai) + '</dd>') : '') +
        agendaRows +
      '</dl>' +
    '</div>';
  document.body.appendChild(backdrop);
  requestAnimationFrame(() => backdrop.classList.add('shown'));

  const close = () => {
    backdrop.classList.remove('shown');
    setTimeout(() => backdrop.remove(), 150);
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop || e.target.closest('.modal-close')) close();
  });
  document.addEventListener('keydown', onKey);
}

function buildAIFilter() {
  const ais = [...new Set(scheduleData.sessions.map(s => s.ai))].sort();
  ais.forEach(ai => { if (state.aiFilter[ai] === undefined) state.aiFilter[ai] = true; });
  // Apply the OFF-list restored from URL hash / localStorage. Unknown names
  // (e.g. from a previous meeting's schedule) are silently ignored.
  RESTORED_AI_OFF.forEach(ai => { if (ai in state.aiFilter) state.aiFilter[ai] = false; });
  const grp = document.getElementById("ai-filter-group");
  grp.innerHTML = "<div style='font-size:11px;color:var(--muted);margin-bottom:6px;'>AGENDA ITEMS</div>";
  ais.forEach(ai => {
    const lbl = document.createElement("label");
    lbl.innerHTML = '<input type="checkbox" ' + (state.aiFilter[ai] ? "checked" : "") +
                    ' data-ai="' + ai + '"> <span>' + ai + '</span>';
    grp.appendChild(lbl);
  });
  grp.addEventListener("change", e => {
    if (e.target.matches("input[data-ai]")) {
      state.aiFilter[e.target.dataset.ai] = e.target.checked;
      saveFilters();
      render();
    }
  });
}

/* ============================================================
   5. Wiring
   ============================================================ */
document.getElementById("controls").addEventListener("click", e => {
  if (!e.target.matches(".chip")) return;
  const cat = e.target.dataset.cat;
  const day = e.target.dataset.day;
  if (cat) {
    state.cats[cat] = e.target.dataset.on !== "true";
    e.target.dataset.on = state.cats[cat];
    saveFilters();
    render();
  } else if (day) {
    // Tab behavior: select only this day, deselect all others.
    DAYS.forEach(d => { state.days[d] = false; });
    state.days[day] = true;
    document.querySelectorAll(".chip.day").forEach(btn => {
      btn.dataset.on = (btn.dataset.day === day) ? "true" : "false";
    });
    render();
    saveViewState();
  } else if (e.target.id === "now-btn") {
    if (e.target.hasAttribute("disabled")) return;
    render();
    setTimeout(() => {
      const line = document.querySelector(".now-line");
      if (line) line.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 50);
  }
});

document.getElementById("panel-toggle").addEventListener("click", () => {
  document.getElementById("panel").classList.toggle("open");
});
document.getElementById("panel-close").addEventListener("click", () => {
  document.getElementById("panel").classList.remove("open");
});
document.getElementById("select-all").addEventListener("click", () => {
  Object.keys(state.aiFilter).forEach(k => state.aiFilter[k] = true);
  document.querySelectorAll("#ai-filter-group input").forEach(i => i.checked = true);
  saveFilters();
  render();
});
document.getElementById("deselect-all").addEventListener("click", () => {
  Object.keys(state.aiFilter).forEach(k => state.aiFilter[k] = false);
  document.querySelectorAll("#ai-filter-group input").forEach(i => i.checked = false);
  saveFilters();
  render();
});
document.getElementById("opacity-slider").addEventListener("input", (e) => {
  const pct = parseInt(e.target.value, 10);
  applyDimPct(pct);
  saveFilters();
});

// Populate title + meta from data
document.getElementById("title").textContent = "\ud83d\udcc5 " + (scheduleData.meeting || "Schedule");
document.title = (scheduleData.meeting || "Schedule") + " \u2014 Schedule";

const metaEl = document.getElementById("meta");
const mi = scheduleData.meetingInfo || {};

  btn.dataset.on = (btn.dataset.day === DEFAULT_DAY) ? "true" : "false";
});

  btn.dataset.on = state.cats[btn.dataset.cat] ? "true" : "false";
});

if (!WITHIN_MEETING) {
  const btn = document.getElementById("now-btn");
  btn.setAttribute("disabled", "");
  btn.title = "NOW indicator is only available during meeting dates";
}

render();

function scrollToInitial() {
  // 1. If we have a saved scroll position from a previous view (e.g. before
  //    the 30-min auto-refresh kicked in), restore it.
  if (savedView && (savedView.scrollX || savedView.scrollY)) {
    window.scrollTo(savedView.scrollX || 0, savedView.scrollY || 0);
    return;
  }
  // 2. Otherwise, if the meeting is in progress, scroll to the NOW line.
  if (WITHIN_MEETING) {
    const line = document.querySelector(".now-line");
    if (line) {
      line.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
  }
  // 3. Otherwise scroll to the top of the day.
  const first = document.querySelector(".day-section");
  if (first) first.scrollIntoView({ behavior: "smooth", block: "start" });
}
setTimeout(scrollToInitial, 100);

// Save scroll position whenever the user scrolls (debounced).
let _saveTimer;
window.addEventListener('scroll', () => {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveViewState, 250);
}, { passive: true });

// Light-weight per-minute update: reposition the now-line and update the
// header clock WITHOUT re-rendering the whole grid. The earlier version
// called render() which wiped main.innerHTML and rebuilt the DOM — on
// mobile, that briefly collapses the page height during the rebuild and
// the browser kicks the scroll position to the top, which felt like the
// page was snapping back mid-drag. This keeps the existing DOM intact and
// only touches the now-line elements + clock text.
function refreshNowLines() {
  document.querySelectorAll('.now-line, .now-overlay').forEach(el => el.remove());
  const PX_PER_MIN = getPxPerMin();
  document.querySelectorAll('.day-section').forEach(section => {
    const day = section.dataset.day;
    if (!day) return;
    const roomCols = Array.from(section.querySelectorAll('.room-col'));
    if (roomCols.length) drawNowLine(roomCols, day, PX_PER_MIN);
  });
  positionNowLabels();
}

// Re-position the NOW line every minute while the meeting is happening.
// No more auto-scroll-to-now-line: it surprised users who paused mid-read
// by jumping the page. They can tap the time chip to recenter manually.
setInterval(() => {
  refreshNowLines();
  updateHeaderClock();
}, 60000);

// Auto-refresh the page every 30 minutes. This re-fetches the latest
// index.html (which the GitHub Actions cron rebuilds every 30 min from
// the FTP). Tab + scroll position survive because we persisted them.
setInterval(() => {
  saveViewState();
  location.reload();
}, 30 * 60 * 1000);

// Mobile browsers suspend timers in background tabs, so the interval above
// never fires while the phone is pocketed. When the tab becomes visible
// again after >30 min, reload immediately instead of showing stale data.
let lastLoadTime = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' &&
      Date.now() - lastLoadTime > 30 * 60 * 1000) {
    saveViewState();
    location.reload();
  }
});

// Publish the sticky controls bar's height as --controls-h so the sticky
// room headers stack directly below it (their `top` reads this var).
function updateControlsHeight() {
  const c = document.getElementById('controls');
  if (c) document.documentElement.style.setProperty('--controls-h', c.offsetHeight + 'px');
}
updateControlsHeight();
window.addEventListener('resize', updateControlsHeight);
window.addEventListener('load', updateControlsHeight); // after webfont swap

// Re-render on viewport WIDTH changes (rotation, mobile/desktop breakpoint
// crossings). We deliberately ignore height-only changes because iOS Safari
// fires a resize event every time the address bar collapses or expands during
// scroll — re-rendering then would reflow the grid mid-scroll and feel like
// the page is bouncing back to where it was.
let _resizeTimer;
let _lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === _lastWidth) return;
  _lastWidth = window.innerWidth;
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(render, 150);
});
</script>
</body>
</html>
